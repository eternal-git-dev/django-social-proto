{% extends "base.html" %}

{% block title %}
    Редактирование профиля — SocialNest
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card">
            <div class="card-body">

                <h1 class="h4 mb-4">
                    Редактирование профиля
                </h1>

                <form
                    method="post"
                    enctype="multipart/form-data"
                >

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Сохранить
                    </button>

                    <a
                        class="btn btn-secondary"
                        href="{% url 'users:profile' username=user.username %}"
                    >
                        Отмена
                    </a>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
