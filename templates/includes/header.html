<header>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a
                class="navbar-brand"
                href="{% url 'posts:post_list' %}"
            >
                SocialNest
            </a>

            <div>

                {% if user.is_authenticated %}

                    <a
                        class="btn btn-outline-light"
                        href="{% url 'users:profile' username=user.username %}"
                    >
                        Профиль
                    </a>

                    <form
                        method="post"
                        action="{% url 'users:logout' %}"
                        class="d-inline"
                    >
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-outline-light"
                        >
                            Выйти
                        </button>
                    </form>

                {% else %}

                    <a
                        class="btn btn-outline-light"
                        href="{% url 'users:login' %}"
                    >
                        Войти
                    </a>

                    <a
                        class="btn btn-light"
                        href="{% url 'users:registration' %}"
                    >
                        Регистрация
                    </a>

                {% endif %}

            </div>
        </div>
    </nav>
</header>
