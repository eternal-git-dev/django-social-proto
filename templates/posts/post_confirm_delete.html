{% extends "base.html" %}

{% block title %}
    Удаление поста — SocialNest
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card">
            <div class="card-body">

                <h1 class="h4 mb-3">
                    Удалить пост?
                </h1>

                <p>
                    Вы действительно хотите удалить
                    «{{ object.topic }}»?
                </p>

                <form method="post">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Удалить
                    </button>

                    <a
                        href="{% url 'posts:post_detail' post_id=object.pk %}"
                        class="btn btn-secondary"
                    >
                        Отмена
                    </a>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
