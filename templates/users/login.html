{% extends "base.html" %}

{% block title %}
    Вход — SocialNest
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card">
            <div class="card-body">

                <h1 class="h4 mb-4">
                    Вход
                </h1>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Войти
                    </button>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
